<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8860b">
  <title>Studio Calendar | Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="app-kicker">Recording Studio</p>
      <h1 class="app-title">Admin</h1>
    </div>
    <div class="header-actions">
      <p class="engineer-pill" data-engineer-name>Engineer</p>
      <button class="btn btn-ghost" type="button" data-logout-btn>Log out</button>
    </div>
  </header>

  <main class="page-content">
    <section class="surface">
      <a href="calendar.html" class="btn-back-link">← Back to Calendar</a>
      <h2>Engineer Access</h2>
      <p class="admin-section-desc">
        Only engineers on this list can sign in to the studio calendar.
        To add someone, copy their Firebase UID from
        <strong>Firebase Console → Authentication → Users</strong>
        and paste it below.
      </p>

      <div id="allowlist-entries" class="admin-list" aria-live="polite">
        <p class="admin-empty">Loading…</p>
      </div>
    </section>

    <section class="surface">
      <h2>Add Engineer</h2>
      <form id="add-engineer-form" class="form-stack" novalidate>
        <label class="field-label" for="engineer-uid">Firebase UID</label>
        <input
          id="engineer-uid"
          name="uid"
          type="text"
          placeholder="e.g. YOUR_OWNER_UID_1"
          autocomplete="off"
          spellcheck="false"
          required
        >

        <label class="field-label" for="engineer-label">
          Display label <span class="field-optional">(optional)</span>
        </label>
        <input
          id="engineer-label"
          name="label"
          type="text"
          placeholder="e.g. DJ Marcus"
        >

        <p id="add-error" class="form-error" role="alert" aria-live="polite"></p>
        <p id="add-success" class="form-success" role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit">Add Engineer</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
