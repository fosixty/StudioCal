<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8860b">
  <title>Studio Calendar | Booking</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="app-kicker">Recording Studio</p>
      <h1 class="app-title">Booking</h1>
    </div>
    <div class="header-actions">
      <p class="engineer-pill" data-engineer-name>Engineer</p>
      <a class="btn btn-ghost" href="admin.html" data-owner-only hidden>Admin</a>
      <button class="btn btn-ghost" type="button" data-logout-btn>Log out</button>
    </div>
  </header>

  <main class="page-content">
    <section class="surface">
      <a href="calendar.html" class="btn-back-link">← Back to Calendar</a>
      <h2 id="booking-heading">New Booking</h2>
      <form id="booking-form" class="form-stack" novalidate>
        <label class="field-label" for="date">Date</label>
        <input id="date" name="date" type="date" required>

        <label class="field-label" for="end-date">End date</label>
        <input id="end-date" name="endDate" type="date" required>

        <label class="checkbox-row" for="repeat-weekly">
          <input id="repeat-weekly" name="repeatWeekly" type="checkbox">
          Repeat weekly
        </label>

        <div id="repeat-until-wrap" hidden>
          <label class="field-label" for="repeat-until-date">Repeat until</label>
          <input id="repeat-until-date" name="repeatUntilDate" type="date">
        </div>

        <label class="field-label" for="start-time">Start time</label>
        <select id="start-time" name="startTime" required>
          <option value="">Select start time…</option>
        </select>

        <label class="field-label" for="end-time">End time</label>
        <select id="end-time" name="endTime" required>
          <option value="">Select end time…</option>
        </select>

        <label class="field-label" for="session-type">Session type</label>
        <select id="session-type" name="sessionType" required>
          <option value="$25/hr">$25/hr</option>
          <option value="$35/hr">$35/hr</option>
          <option value="$45/hr">$45/hr</option>
          <option value="$60/hr">$60/hr</option>
          <option value="Personal">Personal</option>
        </select>

        <div id="customer-field-wrap">
          <label class="field-label" for="customer-name">Customer name</label>
          <input id="customer-name" name="customerName" type="text" placeholder="Client name" required>
        </div>

        <label class="field-label" for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Optional session notes"></textarea>

        <p id="booking-error" class="form-error" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary" id="save-booking-btn" type="button">Save Booking</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/booking.js"></script>
  <script type="module">
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then((registration) => {
          registration.update();
        }).catch((error) => {
          console.error("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
