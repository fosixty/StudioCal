<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8860b">
  <title>Studio Calendar | Confirm Session</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="app-kicker">Recording Studio</p>
      <h1 class="app-title">Session Confirmation</h1>
    </div>
    <div class="header-actions">
      <p class="engineer-pill" data-engineer-name>Engineer</p>
      <button class="btn btn-ghost" type="button" data-logout-btn>Log out</button>
    </div>
  </header>

  <main class="page-content">
    <div id="confirm-loading" class="confirm-loading">
      <p>Loading session…</p>
    </div>

    <section class="confirm-card" id="confirm-view" hidden>
      <div class="confirm-session-info" id="confirm-session-info">
        <!-- populated by JS -->
      </div>

      <p class="confirm-question">Did this session run for the originally scheduled time?</p>

      <div class="confirm-btns" id="confirm-btns">
        <button class="btn btn-primary" type="button" id="btn-yes">Yes, it ran as scheduled</button>
        <button class="btn btn-ghost" type="button" id="btn-no">No, adjust time</button>
      </div>

      <p id="confirm-error" class="form-error" role="alert" aria-live="polite"></p>
    </section>

    <section class="confirm-card" id="no-booking-view" hidden>
      <p>No booking selected. <a href="calendar.html" class="link">Go to calendar</a>.</p>
    </section>
  </main>

  <script type="module" src="js/confirm.js"></script>
  <script type="module">
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then((registration) => {
          registration.update();
        }).catch((error) => {
          console.error("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
